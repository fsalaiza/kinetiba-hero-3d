<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kineti — comparación Three.js</title>

<body><canvas></canvas><div class="runway"></div><aside><strong>Three.js / WebGPU</strong><p>27 piezas · 54 símbolos.<br>Mosaico de 432 piezas.<br>Sin sombras ni posprocesado.</p><p>Desplázate para ver el mosaico.<br><a href="/research/babylon.html">Comparar con Babylon.js</a> · <a href="/">Kineti</a></p><output>Preparando…</output></aside>
<script type="module">
import {createThreeComparison} from '/src/kineti/research/threeScene.js';
try {
 const app = await createThreeComparison(document.querySelector('canvas'));
 window.__COMPARISON__ = app;
 const scroll = () => app.setProgress(scrollY / Math.max(1,document.documentElement.scrollHeight-innerHeight));
 addEventListener('scroll', scroll, {passive:true}); scroll();
 setInterval(()=>{const d=app.getDiagnostics();document.querySelector('output').textContent=JSON.stringify(d,null,2)},500);
}catch(e){document.querySelector('output').textContent=e.stack;console.error(e)}
</script></body></html>
